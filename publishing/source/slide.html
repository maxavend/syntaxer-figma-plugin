<!doctype html>
<!-- Figma Community cover and carousel art, 1920×1080 (safe area 1800×1080).
     Rendered by scripts/render-assets.mjs: slide.html?variant=cover|presets|levels|preview -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root {
      --bg: #17181b;
      --bg-2: #24262b;
      --text: #f5f5f6;
      --muted: #a4a7ae;
      --line: rgba(255, 255, 255, 0.09);
      --accent: #4aa3ff;
      --code: #c9d1d9;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body {
      font-family: "Inter", system-ui, -apple-system, "SF Pro Display", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 85% 20%, rgba(74, 163, 255, 0.16), transparent 60%),
        linear-gradient(160deg, var(--bg-2), var(--bg) 60%);
      -webkit-font-smoothing: antialiased;
    }
    .slide {
      position: absolute;
      inset: 0 60px; /* 1800px safe area */
      display: grid;
      grid-template-columns: 880px 1fr;
      align-items: center;
      gap: 80px;
      padding: 0 60px;
    }
    .logo { width: 112px; height: 112px; border-radius: 26px; margin-bottom: 40px; }
    .eyebrow {
      margin: 0 0 20px;
      color: var(--accent);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: 112px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
    h2 { margin: 0; font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -0.025em; }
    .lead { margin: 28px 0 0; color: var(--muted); font-size: 34px; line-height: 1.4; max-width: 820px; }
    .sample {
      margin-top: 56px;
      padding: 28px 32px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 26px;
      line-height: 1.5;
    }
    .sample .path { color: var(--muted); margin-bottom: 14px; }
    .sample .row { display: grid; grid-template-columns: 150px 1fr; color: var(--code); }
    .sample .row span:first-child {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--muted);
      font-size: 24px;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 48px; max-width: 840px; }
    .chip {
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--code);
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 24px;
    }
    .shots { position: relative; height: 1080px; }
    .shot {
      position: absolute;
      width: 420px;
      border-radius: 18px;
      border: 1px solid var(--line);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
    .shot.main { top: 120px; left: 300px; }
    .shot.back { top: 200px; left: 30px; opacity: 0.96; transform: rotate(-3deg); }
    /* A single screenshot sits centered in its column, slightly larger */
    .shots.single .shot.main { width: 460px; top: 80px; left: calc(50% - 230px); }
  </style>
</head>
<body>
  <main class="slide" id="slide"></main>
  <script>
    const variant = new URLSearchParams(location.search).get('variant') || 'cover';
    const chips = (items) => `<div class="chips">${items.map((item) => `<span class="chip">${item}</span>`).join('')}</div>`;
    const SLIDES = {
      cover: {
        copy: `
          <img class="logo" src="logo.png" alt="" />
          <h1>Syntaxer</h1>
          <p class="lead">Generate consistent code syntax for your Figma variables — for Web, Android and iOS.</p>
          <div class="sample">
            <div class="path">color/background/primary</div>
            <div class="row"><span>Web</span><span>var(--color-background-primary)</span></div>
            <div class="row"><span>Android</span><span>colorBackgroundPrimary</span></div>
            <div class="row"><span>iOS</span><span>ColorBackgroundPrimary</span></div>
          </div>`,
        shots: [['light.png', 'back'], ['dark.png', 'main']],
      },
      presets: {
        copy: `
          <p class="eyebrow">Presets & naming</p>
          <h2>Start from a preset, make it yours</h2>
          <p class="lead">CSS variables, SCSS, Less, Tailwind, Android and iOS presets, 12 naming conventions, and your own prefix, separator and suffix.</p>
          ${chips(['var(--color-bg)', '$color-bg', '@color-bg', 'colorBg', 'ColorBg', 'COLOR_BG'])}`,
        shots: [['naming.png', 'main']],
      },
      levels: {
        copy: `
          <p class="eyebrow">Name structure</p>
          <h2>Shape names to match your code</h2>
          <p class="lead">Syntaxer detects every level in your variable paths. Drop or reorder levels, replace words, and keep camelCase when your codebase uses it.</p>
          ${chips(['fontFamily → font-family', 'background → bg', 'Level 6 → first'])}`,
        shots: [['levels.png', 'main']],
      },
      preview: {
        copy: `
          <p class="eyebrow">Preview & apply</p>
          <h2>Review every name, then apply in one click</h2>
          <p class="lead">Pick whole collections or single groups, check the generated code syntax, and write it to Web, Android and iOS. Nothing changes until you apply.</p>`,
        shots: [['preview.png', 'main']],
      },
    };
    const slide = SLIDES[variant];
    document.getElementById('slide').innerHTML = `
      <section>${slide.copy}</section>
      <section class="shots${slide.shots.length === 1 ? ' single' : ''}">${slide.shots.map(([src, cls]) => `<img class="shot ${cls}" src="${src}" alt="" />`).join('')}</section>`;
  </script>
</body>
</html>
