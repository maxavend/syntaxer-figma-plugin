<!doctype html>
<!-- Figma Community cover and carousel art, 1920×1080 (safe area 1800×1080).
     Rendered by scripts/render-assets.mjs: slide.html?variant=cover|platforms|naming|preview -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet" />
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --text: #17132a;
      --muted: #6e6e73;
      --line: rgba(23, 19, 42, 0.08);
      --pink: #e8357f;
      --teal: #0b9c85;
      --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #ffffff 0%, var(--bg) 70%);
      -webkit-font-smoothing: antialiased;
    }
    .slide { position: absolute; inset: 0 60px; padding: 0 70px; } /* 1800px safe area */
    .split { display: grid; grid-template-columns: 860px 1fr; align-items: center; gap: 60px; height: 100%; }

    .eyebrow { margin: 0 0 22px; color: var(--pink); font-size: 26px; font-weight: 600; letter-spacing: -0.005em; }
    h1, h2 { margin: 0; font-weight: 700; letter-spacing: -0.035em; line-height: 1.02; }
    h2 { font-size: 84px; }
    .lead { margin: 30px 0 0; color: var(--muted); font-size: 34px; line-height: 1.38; letter-spacing: -0.01em; max-width: 800px; }
    .lead strong { color: var(--text); font-weight: 600; }

    /* Brand lockup on the cover */
    .brand { display: flex; align-items: center; gap: 30px; }
    .brand .symbol { width: 190px; height: 190px; margin: -24px -10px -24px -24px; }
    .brand .wordmark { height: 104px; }

    /* Code: the path and its outputs */
    .path { font-family: var(--mono); font-weight: 500; letter-spacing: -0.02em; }
    .path .sep { color: var(--pink); }
    .card {
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 1px 0 var(--line), 0 24px 60px rgba(23, 19, 42, 0.08);
    }
    .outputs { margin-top: 54px; padding: 34px 38px; }
    .outputs .path { font-size: 30px; color: var(--muted); margin-bottom: 18px; }
    .outputs .row { display: grid; grid-template-columns: 140px 1fr; align-items: baseline; padding: 9px 0; }
    .outputs .row + .row { border-top: 1px solid var(--line); }
    .label { color: var(--muted); font-size: 24px; font-weight: 500; }
    .code { font-family: var(--mono); font-size: 29px; letter-spacing: -0.02em; }
    .code .hl { color: var(--teal); }

    /* Plugin windows, framed like Figma's UI3 plugin panel */
    .stage { position: relative; height: 1080px; }
    .window {
      position: absolute;
      width: 420px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06), 0 40px 90px rgba(23, 19, 42, 0.22), 0 10px 24px rgba(23, 19, 42, 0.10);
    }
    .window .bar {
      height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px;
      font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
    }
    .window .bar img { width: 24px; height: 24px; }
    .window .bar .x { margin-left: auto; opacity: 0.55; font-weight: 400; font-size: 22px; }
    .window.dark .bar { background: #2c2c2c; color: #fff; border-bottom: 1px solid #383838; }
    .window.light .bar { background: #fff; color: #000; border-bottom: 1px solid #e6e6e6; }
    .window > img.ui { display: block; width: 100%; }

    .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 44px; max-width: 820px; }
    .chip {
      padding: 11px 20px; border-radius: 999px; background: var(--card);
      box-shadow: 0 0 0 1px var(--line); font-family: var(--mono); font-size: 23px; letter-spacing: -0.02em;
    }
    .chip b { color: var(--pink); font-weight: 500; }

    .checks { list-style: none; padding: 0; margin: 46px 0 0; display: grid; gap: 22px; }
    .checks li { display: flex; gap: 18px; align-items: flex-start; font-size: 30px; line-height: 1.35; letter-spacing: -0.01em; }
    .checks svg { flex: none; width: 34px; height: 34px; margin-top: 2px; }

    /* Platforms slide: centred, path fanning out to three outputs */
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
    .center .lead { max-width: 1100px; }
    .bigpath { margin-top: 70px; font-size: 64px; padding: 26px 44px; border-radius: 24px; }
    .fan { width: 1680px; height: 110px; display: block; }
    .targets { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; width: 1680px; }
    .target { padding: 34px 32px; text-align: left; }
    .target .platform { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; margin-bottom: 18px; }
    .target .platform i { width: 12px; height: 12px; border-radius: 4px; background: var(--teal); }
    .target .code { font-size: 28px; white-space: nowrap; }
  </style>
</head>
<body>
  <main class="slide" id="slide"></main>
  <script>
    const variant = new URLSearchParams(location.search).get('variant') || 'cover';
    const sep = (path) => path.split('/').join('<span class="sep">/</span>');
    const win = (src, theme, style) => `
      <div class="window ${theme}" style="${style}">
        <div class="bar"><img src="icon.svg" alt="" />Syntaxer<span class="x">×</span></div>
        <img class="ui" src="${src}" alt="" />
      </div>`;
    const check = '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="#0b9c85"/><path d="M10 17.5l4.6 4.6L24 12.7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const SLIDES = {
      cover: `
        <div class="split">
          <section>
            <div class="brand">
              <img class="symbol" src="symbol.svg" alt="" />
              <img class="wordmark" src="wordmark.svg" alt="Syntaxer" />
            </div>
            <p class="lead" style="margin-top:44px;font-size:40px"><strong>Code syntax for your Figma variables.</strong><br />Web, Android and iOS — in one click.</p>
            <div class="card outputs">
              <div class="path">${sep('color/background/primary')}</div>
              <div class="row"><span class="label">Web</span><span class="code">var(--color-background-primary)</span></div>
              <div class="row"><span class="label">Android</span><span class="code">colorBackgroundPrimary</span></div>
              <div class="row"><span class="label">iOS</span><span class="code">ColorBackgroundPrimary</span></div>
            </div>
          </section>
          <section class="stage">
            ${win('light.png', 'light', 'top:130px;left:60px;transform:rotate(-4deg)')}
            ${win('dark.png', 'dark', 'top:80px;left:360px')}
          </section>
        </div>`,

      platforms: `
        <div class="center">
          <p class="eyebrow">How it works</p>
          <h2>One path. Every platform.</h2>
          <p class="lead">Syntaxer reads the variable paths you already have and writes the name each platform expects into Dev Mode.</p>
          <div class="card path bigpath">${sep('color/background/primary')}</div>
          <svg class="fan" viewBox="0 0 1680 110" fill="none" stroke="#c9c7d3" stroke-width="3" stroke-linecap="round">
            <path d="M840 0 V30 C840 70 333 40 333 110" /><path d="M840 0 V30 C840 70 935 40 935 110" /><path d="M840 0 V30 C840 70 1442 40 1442 110" />
          </svg>
          <div class="targets">
            <div class="card target"><div class="platform"><i></i>Web</div><div class="code">var(--color-<span class="hl">background</span>-primary)</div></div>
            <div class="card target"><div class="platform"><i></i>Android</div><div class="code">color<span class="hl">Background</span>Primary</div></div>
            <div class="card target"><div class="platform"><i></i>iOS</div><div class="code">Color<span class="hl">Background</span>Primary</div></div>
          </div>
        </div>`,

      naming: `
        <div class="split">
          <section>
            <p class="eyebrow">Presets, naming and structure</p>
            <h2>Names that match your&nbsp;code</h2>
            <p class="lead">Start from a preset, pick one of 12 naming conventions, then drop, reorder or replace parts of the path.</p>
            <div class="chips">
              <span class="chip">kebab-case</span><span class="chip">camelCase</span><span class="chip">PascalCase</span>
              <span class="chip">snake_case</span><span class="chip">SCREAMING_SNAKE</span><span class="chip">dot.case</span>
              <span class="chip">background <b>→</b> bg</span><span class="chip">fontFamily <b>→</b> font-family</span>
            </div>
          </section>
          <section class="stage">
            ${win('levels.png', 'dark', 'top:130px;left:40px;transform:rotate(-4deg)')}
            ${win('naming.png', 'dark', 'top:80px;left:360px')}
          </section>
        </div>`,

      preview: `
        <div class="split">
          <section>
            <p class="eyebrow">Preview and apply</p>
            <h2>See every name before it&nbsp;lands</h2>
            <p class="lead">Pick collections or single groups and the platforms to write. Nothing changes until you apply.</p>
            <ul class="checks">
              <li>${check}<span>Live preview of every generated name</span></li>
              <li>${check}<span>Writes Web, Android and iOS code syntax</span></li>
              <li>${check}<span>Never renames variables; <strong>Clear syntax</strong> undoes it</span></li>
              <li>${check}<span>No network access. Runs entirely in your file</span></li>
            </ul>
          </section>
          <section class="stage">
            ${win('preview-light.png', 'light', 'top:130px;left:40px;transform:rotate(-4deg)')}
            ${win('preview.png', 'dark', 'top:80px;left:360px')}
          </section>
        </div>`,
    };
    document.getElementById('slide').innerHTML = SLIDES[variant];
  </script>
</body>
</html>
